[package]
name = "kcd2-abi"
version = "0.1.0"
edition = "2021"
description = "KCD2 native binding cage: Win64 host FFI, guarded memory reads, module/RVA handling and the patch machinery."
license = "MIT"
repository = "https://github.com/muyuanjin/kcd2-console-silence"

[lib]
name = "kcd2_abi"

[dependencies]
# 通用基础设施用成熟开源实现；引擎特定机制（hook 跳板/RPM 守卫/Lua 桥）保持自研。
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
